image: docker:latest

services:
  - docker:dind

before_script:
  - docker info

build_develop:
  only:
    - develop
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t ${CI_REGISTRY}/${CI_PROJECT_PATH}:d$CI_PIPELINE_ID -f ./docker/Dockerfile .
    - docker push ${CI_REGISTRY}/${CI_PROJECT_PATH}:d$CI_PIPELINE_ID
    - docker tag ${CI_REGISTRY}/${CI_PROJECT_PATH}:d$CI_PIPELINE_ID ${CI_REGISTRY}/${CI_PROJECT_PATH}:devel
    - docker push ${CI_REGISTRY}/${CI_PROJECT_PATH}:devel
  after_script:
    - docker logout ${CI_REGISTRY}
  stage: build
  tags:
    - local

